<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新记忆配对游戏 - GameHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            perspective: 1000px;
            cursor: pointer;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: matchPulse 0.5s ease;
        }

        @keyframes matchPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: rotateY(180deg);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        .difficulty-selector {
            margin-bottom: 20px;
        }

        .difficulty-btn {
            margin: 5px;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .theme-selector {
            margin-bottom: 20px;
        }

        .theme-btn {
            margin: 5px;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .card-front,
            .card-back {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧠 新记忆配对游戏</h1>
        
        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="easy">简单 (4x3)</button>
            <button class="difficulty-btn" data-difficulty="medium">中等 (4x4)</button>
            <button class="difficulty-btn" data-difficulty="hard">困难 (6x4)</button>
        </div>

        <div class="theme-selector">
            <button class="theme-btn" data-theme="animals">🐾 动物</button>
            <button class="theme-btn" data-theme="food">🍕 食物</button>
            <button class="theme-btn" data-theme="sports">⚽ 运动</button>
            <button class="theme-btn" data-theme="flags">🌍 国旗</button>
        </div>
        
        <div class="game-stats">
            <div class="stat-item">
                <span class="stat-label">移动次数</span>
                <span class="stat-value" id="moves">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">配对数</span>
                <span class="stat-value" id="matches">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">用时</span>
                <span class="stat-value" id="timer">00:00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最高分</span>
                <span class="stat-value" id="highScore">--</span>
            </div>
        </div>
        
        <div class="cards-grid" id="cardsGrid"></div>
        
        <div class="controls">
            <button id="restartBtn">🔄 重新开始</button>
            <button id="hintBtn">💡 提示</button>
        </div>
    </div>

    <div id="winModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="winTitle">🎉 恭喜你！</h2>
            <p id="winMessage">你完成了游戏！</p>
            <button onclick="restartGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const themes = {
            animals: ['🐶', '🐱', '🐼', '🦊', '🐸', '🦁', '🐯', '🐨', '🐰', '🐻', '🐮', '🐷'],
            food: ['🍕', '🍔', '🌭', '🍟', '🍿', '🧀', '🍩', '🍪', '🍰', '🎂', '🍫', '🍭'],
            sports: ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏓', '🏸', '🎱', '⛳', '🏹', '🥊'],
            flags: ['🇨🇳', '🇺🇸', '🇯🇵', '🇬🇧', '🇫🇷', '🇩🇪', '🇮🇹', '🇪🇸', '🇧🇷', '🇷🇺', '🇮🇳', '🇦🇺']
        };

        const difficulties = {
            easy: { cols: 4, rows: 3, pairs: 6 },
            medium: { cols: 4, rows: 4, pairs: 8 },
            hard: { cols: 6, rows: 4, pairs: 12 }
        };

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;
        let currentDifficulty = 'easy';
        let currentTheme = 'animals';
        let highScoreKey = '';

        const cardsGrid = document.getElementById('cardsGrid');
        const movesElement = document.getElementById('moves');
        const matchesElement = document.getElementById('matches');
        const timerElement = document.getElementById('timer');
        const highScoreElement = document.getElementById('highScore');
        const winModal = document.getElementById('winModal');
        const winTitle = document.getElementById('winTitle');
        const winMessage = document.getElementById('winMessage');
        const restartBtn = document.getElementById('restartBtn');
        const hintBtn = document.getElementById('hintBtn');

        function initGame() {
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            seconds = 0;
            gameStarted = false;

            if (timer) {
                clearInterval(timer);
            }

            highScoreKey = `memory-match-${currentDifficulty}-${currentTheme}`;
            updateStats();
            loadHighScore();
            createCards();
        }

        function createCards() {
            const config = difficulties[currentDifficulty];
            const themeEmojis = themes[currentTheme];
            const selectedEmojis = themeEmojis.slice(0, config.pairs);
            
            cards = [];
            for (let i = 0; i < config.pairs; i++) {
                cards.push({ id: i, emoji: selectedEmojis[i], isFlipped: false, isMatched: false });
                cards.push({ id: i, emoji: selectedEmojis[i], isFlipped: false, isMatched: false });
            }

            shuffleArray(cards);
            renderCards();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderCards() {
            const config = difficulties[currentDifficulty];
            cardsGrid.innerHTML = '';
            cardsGrid.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.index = index;
                cardElement.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">❓</div>
                        <div class="card-back">${card.emoji}</div>
                    </div>
                `;
                cardElement.addEventListener('click', () => flipCard(index));
                cardsGrid.appendChild(cardElement);
            });
        }

        function flipCard(index) {
            if (!gameStarted) {
                startTimer();
                gameStarted = true;
            }

            const card = cards[index];
            if (card.isFlipped || card.isMatched || flippedCards.length >= 2) {
                return;
            }

            card.isFlipped = true;
            flippedCards.push(index);

            const cardElement = cardsGrid.children[index];
            cardElement.classList.add('flipped');

            if (flippedCards.length === 2) {
                moves++;
                movesElement.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [index1, index2] = flippedCards;
            const card1 = cards[index1];
            const card2 = cards[index2];

            if (card1.id === card2.id) {
                card1.isMatched = true;
                card2.isMatched = true;
                matchedPairs++;
                matchesElement.textContent = matchedPairs;

                const cardElement1 = cardsGrid.children[index1];
                const cardElement2 = cardsGrid.children[index2];
                cardElement1.classList.add('matched');
                cardElement2.classList.add('matched');

                flippedCards = [];

                const config = difficulties[currentDifficulty];
                if (matchedPairs === config.pairs) {
                    winGame();
                }
            } else {
                setTimeout(() => {
                    card1.isFlipped = false;
                    card2.isFlipped = false;

                    const cardElement1 = cardsGrid.children[index1];
                    const cardElement2 = cardsGrid.children[index2];
                    cardElement1.classList.remove('flipped');
                    cardElement2.classList.remove('flipped');

                    flippedCards = [];
                }, 1000);
            }
        }

        function startTimer() {
            timer = setInterval(() => {
                seconds++;
                updateTimer();
            }, 1000);
        }

        function updateTimer() {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerElement.textContent = `${mins}:${secs}`;
        }

        function updateStats() {
            movesElement.textContent = moves;
            matchesElement.textContent = matchedPairs;
        }

        function winGame() {
            clearInterval(timer);
            
            const score = calculateScore();
            saveHighScore(score);
            
            winTitle.textContent = '🎉 恭喜获胜！';
            winMessage.innerHTML = `
                你完成了游戏！<br><br>
                用时: ${timerElement.textContent}<br>
                移动次数: ${moves}<br>
                得分: ${score}
            `;
            winModal.classList.remove('hidden');
        }

        function calculateScore() {
            const config = difficulties[currentDifficulty];
            const baseScore = config.pairs * 100;
            const timeBonus = Math.max(0, 300 - seconds) * 2;
            const movesPenalty = Math.max(0, moves - config.pairs) * 5;
            return Math.max(100, baseScore + timeBonus - movesPenalty);
        }

        function loadHighScore() {
            const highScore = localStorage.getItem(highScoreKey);
            highScoreElement.textContent = highScore || '--';
        }

        function saveHighScore(score) {
            const currentHighScore = parseInt(localStorage.getItem(highScoreKey) || '0');
            if (score > currentHighScore) {
                localStorage.setItem(highScoreKey, score);
                highScoreElement.textContent = score;
            }
        }

        function showHint() {
            const unmatchedCards = cards
                .map((card, index) => ({ ...card, index }))
                .filter(card => !card.isMatched && !card.isFlipped);

            if (unmatchedCards.length >= 2) {
                const [card1, card2] = unmatchedCards;
                const cardElement1 = cardsGrid.children[card1.index];
                const cardElement2 = cardsGrid.children[card2.index];
                
                cardElement1.style.animation = 'pulse 0.5s ease 3';
                cardElement2.style.animation = 'pulse 0.5s ease 3';
                
                setTimeout(() => {
                    cardElement1.style.animation = '';
                    cardElement2.style.animation = '';
                }, 1500);
            }
        }

        function restartGame() {
            winModal.classList.add('hidden');
            initGame();
        }

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.dataset.difficulty;
                initGame();
            });
        });

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTheme = btn.dataset.theme;
                initGame();
            });
        });

        restartBtn.addEventListener('click', restartGame);
        hintBtn.addEventListener('click', showHint);

        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
                50% { transform: scale(1.1); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6); }
            }
        `;
        document.head.appendChild(style);

        initGame();
    </script>
</body>
</html>
