<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048数字游戏 - GameHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .game-board {
            background: #bbada0;
            border-radius: 10px;
            padding: 15px;
            margin: 20px auto;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .grid-cell {
            width: 90px;
            height: 90px;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #776e65;
        }

        .tile {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.15s ease;
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.7rem; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.7rem; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.7rem; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.4rem; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.4rem; }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 1.2rem; }

        .tile-new {
            animation: appear 0.2s ease-in-out;
        }

        .tile-merged {
            animation: pop 0.2s ease-in-out;
        }

        @keyframes appear {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .mobile-row {
            display: flex;
            gap: 10px;
        }

        .dir-btn {
            width: 70px;
            height: 70px;
            padding: 0;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .game-container {
                padding: 20px;
            }

            .game-board {
                padding: 10px;
                max-width: 100%;
            }

            .grid-container {
                gap: 10px;
            }

            .grid-cell, .tile {
                width: 65px;
                height: 65px;
                font-size: 1.4rem;
            }

            .tile-128, .tile-256, .tile-512 {
                font-size: 1.2rem;
            }

            .tile-1024, .tile-2048 {
                font-size: 1rem;
            }

            .tile-super {
                font-size: 0.8rem;
            }

            .mobile-controls {
                display: flex;
            }

            .game-stats {
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 400px) {
            .grid-cell, .tile {
                width: 55px;
                height: 55px;
                font-size: 1.2rem;
            }

            .tile-128, .tile-256, .tile-512 {
                font-size: 1rem;
            }

            .tile-1024, .tile-2048 {
                font-size: 0.9rem;
            }

            .tile-super {
                font-size: 0.7rem;
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧩 2048数字游戏</h1>
        <div class="game-stats">
            <div class="stat-item">
                <span class="stat-label">得分</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最高分</span>
                <span class="stat-value" id="highScore">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最高方块</span>
                <span class="stat-value" id="maxTile">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">移动次数</span>
                <span class="stat-value" id="moves">0</span>
            </div>
        </div>
        <div class="game-board">
            <div class="grid-container" id="gridContainer">
            </div>
        </div>
        <div class="controls">
            <button id="newGameBtn">🎮 新游戏</button>
            <button id="undoBtn">↩️ 撤销</button>
            <button id="autoBtn">🤖 自动演示</button>
        </div>
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="dir-btn" id="upBtn">⬆️</button>
            </div>
            <div class="mobile-row">
                <button class="dir-btn" id="leftBtn">⬅️</button>
                <button class="dir-btn" id="downBtn">⬇️</button>
                <button class="dir-btn" id="rightBtn">➡️</button>
            </div>
        </div>
    </div>

    <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">游戏结束！</h2>
            <p id="modalMessage">最终得分: 0</p>
            <button onclick="newGame()">再来一局</button>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('gridContainer');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const maxTileElement = document.getElementById('maxTile');
        const movesElement = document.getElementById('moves');
        const newGameBtn = document.getElementById('newGameBtn');
        const undoBtn = document.getElementById('undoBtn');
        const autoBtn = document.getElementById('autoBtn');
        const gameOverModal = document.getElementById('gameOverModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        const GRID_SIZE = 4;
        let grid = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('2048HighScore')) || 0;
        let maxTile = 0;
        let moves = 0;
        let history = [];
        let gameOver = false;
        let autoPlaying = false;
        let autoInterval;

        highScoreElement.textContent = highScore;

        function initGame() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            maxTile = 0;
            moves = 0;
            history = [];
            gameOver = false;
            autoPlaying = false;
            clearInterval(autoInterval);
            autoBtn.textContent = '🤖 自动演示';

            scoreElement.textContent = score;
            maxTileElement.textContent = maxTile;
            movesElement.textContent = moves;
            gameOverModal.classList.add('hidden');

            addRandomTile();
            addRandomTile();
            renderGrid();
        }

        function saveState() {
            history.push({
                grid: grid.map(row => [...row]),
                score: score,
                maxTile: maxTile,
                moves: moves
            });
            if (history.length > 10) {
                history.shift();
            }
        }

        function undo() {
            if (history.length > 0) {
                const state = history.pop();
                grid = state.grid.map(row => [...row]);
                score = state.score;
                maxTile = state.maxTile;
                moves = state.moves;
                scoreElement.textContent = score;
                maxTileElement.textContent = maxTile;
                movesElement.textContent = moves;
                renderGrid();
            }
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (grid[i][j] === 0) {
                        emptyCells.push({ row: i, col: j });
                    }
                }
            }

            if (emptyCells.length > 0) {
                const { row, col } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[row][col] = Math.random() < 0.9 ? 2 : 4;
                maxTile = Math.max(maxTile, grid[row][col]);
                maxTileElement.textContent = maxTile;
            }
        }

        function renderGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    if (grid[i][j] !== 0) {
                        const tile = document.createElement('div');
                        let tileClass = grid[i][j] <= 2048 ? `tile-${grid[i][j]}` : 'tile-super';
                        tile.className = `tile ${tileClass}`;
                        tile.textContent = grid[i][j];
                        cell.appendChild(tile);
                    }
                    
                    gridContainer.appendChild(cell);
                }
            }
        }

        function slide(row) {
            let arr = row.filter(val => val !== 0);
            let scoreAdded = 0;
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    scoreAdded += arr[i];
                    maxTile = Math.max(maxTile, arr[i]);
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < GRID_SIZE) {
                arr.push(0);
            }
            return { row: arr, score: scoreAdded };
        }

        function moveLeft() {
            let moved = false;
            let totalScore = 0;
            for (let i = 0; i < GRID_SIZE; i++) {
                const result = slide(grid[i]);
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (grid[i][j] !== result.row[j]) {
                        moved = true;
                    }
                    grid[i][j] = result.row[j];
                }
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function moveRight() {
            let moved = false;
            let totalScore = 0;
            for (let i = 0; i < GRID_SIZE; i++) {
                const result = slide(grid[i].reverse());
                result.row.reverse();
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (grid[i][j] !== result.row[j]) {
                        moved = true;
                    }
                    grid[i][j] = result.row[j];
                }
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function moveUp() {
            let moved = false;
            let totalScore = 0;
            for (let j = 0; j < GRID_SIZE; j++) {
                let col = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    col.push(grid[i][j]);
                }
                const result = slide(col);
                for (let i = 0; i < GRID_SIZE; i++) {
                    if (grid[i][j] !== result.row[i]) {
                        moved = true;
                    }
                    grid[i][j] = result.row[i];
                }
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function moveDown() {
            let moved = false;
            let totalScore = 0;
            for (let j = 0; j < GRID_SIZE; j++) {
                let col = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    col.push(grid[i][j]);
                }
                const result = slide(col.reverse());
                result.row.reverse();
                for (let i = 0; i < GRID_SIZE; i++) {
                    if (grid[i][j] !== result.row[i]) {
                        moved = true;
                    }
                    grid[i][j] = result.row[i];
                }
                totalScore += result.score;
            }
            return { moved, score: totalScore };
        }

        function makeMove(direction) {
            if (gameOver) return;
            
            saveState();
            
            let result;
            switch (direction) {
                case 'left': result = moveLeft(); break;
                case 'right': result = moveRight(); break;
                case 'up': result = moveUp(); break;
                case 'down': result = moveDown(); break;
            }

            if (result.moved) {
                score += result.score;
                moves++;
                scoreElement.textContent = score;
                maxTileElement.textContent = maxTile;
                movesElement.textContent = moves;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('2048HighScore', highScore);
                }

                addRandomTile();
                renderGrid();
                
                if (checkGameOver()) {
                    endGame();
                } else if (maxTile >= 2048) {
                    checkWin();
                }
            }
        }

        function checkGameOver() {
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (grid[i][j] === 0) return false;
                    if (j < GRID_SIZE - 1 && grid[i][j] === grid[i][j + 1]) return false;
                    if (i < GRID_SIZE - 1 && grid[i][j] === grid[i + 1][j]) return false;
                }
            }
            return true;
        }

        function checkWin() {
            modalTitle.textContent = '🎉 恭喜！';
            modalMessage.textContent = `你合成了 ${maxTile}！\n得分: ${score}\n移动次数: ${moves}`;
            gameOverModal.classList.remove('hidden');
        }

        function endGame() {
            gameOver = true;
            autoPlaying = false;
            clearInterval(autoInterval);
            autoBtn.textContent = '🤖 自动演示';
            
            modalTitle.textContent = '游戏结束！';
            modalMessage.textContent = `最终得分: ${score}\n最高方块: ${maxTile}\n移动次数: ${moves}`;
            gameOverModal.classList.remove('hidden');
        }

        function newGame() {
            initGame();
        }

        function toggleAutoPlay() {
            autoPlaying = !autoPlaying;
            if (autoPlaying) {
                autoBtn.textContent = '⏹️ 停止演示';
                autoInterval = setInterval(() => {
                    const directions = ['up', 'down', 'left', 'right'];
                    const randomDirection = directions[Math.floor(Math.random() * directions.length)];
                    makeMove(randomDirection);
                }, 300);
            } else {
                autoBtn.textContent = '🤖 自动演示';
                clearInterval(autoInterval);
            }
        }

        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                    makeMove('left');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    makeMove('right');
                    e.preventDefault();
                    break;
                case 'ArrowUp':
                    makeMove('up');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    makeMove('down');
                    e.preventDefault();
                    break;
            }
        });

        let touchStartX, touchStartY;

        gridContainer.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        gridContainer.addEventListener('touchend', function(e) {
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    makeMove('right');
                } else {
                    makeMove('left');
                }
            } else {
                if (diffY > 0) {
                    makeMove('down');
                } else {
                    makeMove('up');
                }
            }
            
            touchStartX = null;
            touchStartY = null;
        });

        newGameBtn.addEventListener('click', newGame);
        undoBtn.addEventListener('click', undo);
        autoBtn.addEventListener('click', toggleAutoPlay);

        upBtn.addEventListener('touchstart', (e) => { e.preventDefault(); makeMove('up'); });
        downBtn.addEventListener('touchstart', (e) => { e.preventDefault(); makeMove('down'); });
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); makeMove('left'); });
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); makeMove('right'); });

        upBtn.addEventListener('mousedown', () => makeMove('up'));
        downBtn.addEventListener('mousedown', () => makeMove('down'));
        leftBtn.addEventListener('mousedown', () => makeMove('left'));
        rightBtn.addEventListener('mousedown', () => makeMove('right'));

        initGame();
    </script>
</body>
</html>
