<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块游戏 - GameHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .main-board {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            background: #1a1a2e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 150px;
        }

        .panel-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 15px;
            color: white;
        }

        .panel-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .panel-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .next-piece-canvas {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            margin-top: 5px;
        }

        .top-stats {
            display: none;
        }

        .top-stats .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-stats .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .top-stats .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .top-stats .next-piece-canvas {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            margin-top: 5px;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .bottom-controls {
            margin-top: 25px;
        }

        .desktop-only {
            display: flex;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding-top: 5px;
        }

        .mobile-row {
            display: flex;
            gap: 8px;
        }

        .dir-btn {
            width: 55px;
            height: 55px;
            padding: 0;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .action-btn {
            width: 75px;
            padding: 8px;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 1.8rem;
            }

            canvas {
                width: 100%;
                height: auto;
            }

            .mobile-controls {
                display: flex;
            }

            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }

            .desktop-only {
                display: none !important;
            }

            .top-stats {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 20px;
                padding: 15px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border-radius: 10px;
                color: white;
                flex-wrap: wrap;
                gap: 15px;
            }

            .top-stats .stat-value {
                font-size: 1.1rem;
            }

            .top-stats .stat-label {
                font-size: 0.75rem;
            }

            .top-stats .next-piece-canvas {
                width: 80px;
                height: 80px;
            }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 俄罗斯方块游戏</h1>
        <div class="top-stats">
            <div class="stat-item">
                <span class="stat-label">下一个</span>
                <canvas id="nextCanvas" class="next-piece-canvas" width="120" height="120"></canvas>
            </div>
            <div class="stat-item">
                <span class="stat-label">得分</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">等级</span>
                <span class="stat-value" id="level">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">消除行数</span>
                <span class="stat-value" id="lines">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">最高分</span>
                <span class="stat-value" id="highScore">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">总消除</span>
                <span class="stat-value" id="totalLines">0</span>
            </div>
        </div>
        <div class="game-wrapper">
            <div class="main-board">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
            </div>
            <div class="side-panel desktop-only">
                <div class="panel-box">
                    <h3>下一个</h3>
                    <canvas id="nextCanvasDesktop" class="next-piece-canvas" width="120" height="120"></canvas>
                </div>
                <div class="panel-box">
                    <h3>得分</h3>
                    <div class="panel-value" id="scoreDesktop">0</div>
                </div>
                <div class="panel-box">
                    <h3>等级</h3>
                    <div class="panel-value" id="levelDesktop">1</div>
                </div>
                <div class="panel-box">
                    <h3>消除行数</h3>
                    <div class="panel-value" id="linesDesktop">0</div>
                </div>
            </div>
        </div>
        <div class="game-stats desktop-only">
            <div class="stat-item">
                <span class="stat-label">最高分</span>
                <span class="stat-value" id="highScoreDesktop">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">总消除</span>
                <span class="stat-value" id="totalLinesDesktop">0</span>
            </div>
        </div>
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="dir-btn" id="rotateBtn">🔄</button>
            </div>
            <div class="mobile-row">
                <button class="dir-btn" id="leftBtn">⬅️</button>
                <button class="dir-btn" id="downBtn">⬇️</button>
                <button class="dir-btn" id="rightBtn">➡️</button>
            </div>
            <div class="mobile-row">
                <button class="action-btn" id="dropBtn">快速下落</button>
            </div>
        </div>
        <div class="controls bottom-controls">
            <button id="startBtn">🚀 开始游戏</button>
            <button id="pauseBtn">⏸️ 暂停</button>
            <button id="resetBtn">🔄 重置</button>
        </div>
    </div>

    <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">游戏结束！</h2>
            <p id="modalMessage">最终得分: 0</p>
            <button onclick="resetGame()">再来一局</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const nextCanvasDesktop = document.getElementById('nextCanvasDesktop');
        const nextCtxDesktop = nextCanvasDesktop ? nextCanvasDesktop.getContext('2d') : null;
        const scoreElement = document.getElementById('score');
        const scoreElementDesktop = document.getElementById('scoreDesktop');
        const levelElement = document.getElementById('level');
        const levelElementDesktop = document.getElementById('levelDesktop');
        const linesElement = document.getElementById('lines');
        const linesElementDesktop = document.getElementById('linesDesktop');
        const highScoreElement = document.getElementById('highScore');
        const highScoreElementDesktop = document.getElementById('highScoreDesktop');
        const totalLinesElement = document.getElementById('totalLines');
        const totalLinesElementDesktop = document.getElementById('totalLinesDesktop');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const leftBtn = document.getElementById('leftBtn');
        const downBtn = document.getElementById('downBtn');
        const rightBtn = document.getElementById('rightBtn');
        const dropBtn = document.getElementById('dropBtn');
        const gameOverModal = document.getElementById('gameOverModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const COLORS = [
            null,
            '#e74c3c',
            '#3498db',
            '#2ecc71',
            '#f1c40f',
            '#9b59b6',
            '#e67e22',
            '#1abc9c'
        ];

        const SHAPES = [
            null,
            [[1,1,1,1]],
            [[2,2],[2,2]],
            [[0,3,0],[3,3,3]],
            [[0,4,4],[4,4,0]],
            [[5,5,0],[0,5,5]],
            [[6,0,0],[6,6,6]],
            [[0,0,7],[7,7,7]]
        ];

        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let totalLines = 0;
        let highScore = parseInt(localStorage.getItem('tetrisHighScore')) || 0;
        let gameStarted = false;
        let isPaused = false;
        let gameOver = false;
        let gameInterval = null;
        let dropSpeed = 1000;

        highScoreElement.textContent = highScore;

        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }

        function createPiece(type) {
            const shape = SHAPES[type];
            return {
                type: type,
                shape: shape,
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0
            };
        }

        function randomPiece() {
            const type = Math.floor(Math.random() * 7) + 1;
            return createPiece(type);
        }

        function drawBlock(context, x, y, color, size = BLOCK_SIZE) {
            context.fillStyle = color;
            context.fillRect(x * size, y * size, size - 1, size - 1);
            
            const gradient = context.createLinearGradient(x * size, y * size, x * size + size, y * size + size);
            gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.3)');
            context.fillStyle = gradient;
            context.fillRect(x * size, y * size, size - 1, size - 1);
            
            context.strokeStyle = 'rgba(255,255,255,0.5)';
            context.lineWidth = 2;
            context.strokeRect(x * size + 1, y * size + 1, size - 3, size - 3);
        }

        function drawBoard() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * BLOCK_SIZE);
                ctx.lineTo(canvas.width, i * BLOCK_SIZE);
                ctx.stroke();
            }
            for (let j = 0; j <= COLS; j++) {
                ctx.beginPath();
                ctx.moveTo(j * BLOCK_SIZE, 0);
                ctx.lineTo(j * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(ctx, x, y, COLORS[board[y][x]]);
                    }
                }
            }
        }

        function drawPiece(piece, context = ctx, offsetX = 0, offsetY = 0, size = BLOCK_SIZE) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(context, piece.x + x + offsetX, piece.y + y + offsetY, COLORS[value], size);
                    }
                });
            });
        }

        function drawNextPiece() {
            nextCtx.fillStyle = 'rgba(0,0,0,0.2)';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const offsetX = (4 - nextPiece.shape[0].length) / 2;
                const offsetY = (4 - nextPiece.shape.length) / 2;
                const tempPiece = {
                    ...nextPiece,
                    x: offsetX,
                    y: offsetY
                };
                tempPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(nextCtx, tempPiece.x + x, tempPiece.y + y, COLORS[value], 30);
                        }
                    });
                });
            }

            if (nextCtxDesktop) {
                nextCtxDesktop.fillStyle = 'rgba(0,0,0,0.2)';
                nextCtxDesktop.fillRect(0, 0, nextCanvasDesktop.width, nextCanvasDesktop.height);
                
                if (nextPiece) {
                    const offsetX = (4 - nextPiece.shape[0].length) / 2;
                    const offsetY = (4 - nextPiece.shape.length) / 2;
                    const tempPiece = {
                        ...nextPiece,
                        x: offsetX,
                        y: offsetY
                    };
                    tempPiece.shape.forEach((row, y) => {
                        row.forEach((value, x) => {
                            if (value) {
                                drawBlock(nextCtxDesktop, tempPiece.x + x, tempPiece.y + y, COLORS[value], 30);
                            }
                        });
                    });
                }
            }
        }

        function collides(piece, offsetX = 0, offsetY = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;
                        
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        board[currentPiece.y + y][currentPiece.x + x] = value;
                    }
                });
            });
        }

        function rotate(piece) {
            const newShape = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );
            return { ...piece, shape: newShape };
        }

        function clearLines() {
            let linesCleared = 0;
            
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++;
                }
            }
            
            if (linesCleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;
                lines += linesCleared;
                totalLines += linesCleared;
                
                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    dropSpeed = Math.max(100, 1000 - (level - 1) * 100);
                    resetInterval();
                }
                
                scoreElement.textContent = score;
                if (scoreElementDesktop) scoreElementDesktop.textContent = score;
                levelElement.textContent = level;
                if (levelElementDesktop) levelElementDesktop.textContent = level;
                linesElement.textContent = lines;
                if (linesElementDesktop) linesElementDesktop.textContent = lines;
                totalLinesElement.textContent = totalLines;
                if (totalLinesElementDesktop) totalLinesElementDesktop.textContent = totalLines;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    if (highScoreElementDesktop) highScoreElementDesktop.textContent = highScore;
                    localStorage.setItem('tetrisHighScore', highScore);
                }
            }
        }

        function drop() {
            if (!collides(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                merge();
                clearLines();
                currentPiece = nextPiece;
                nextPiece = randomPiece();
                
                if (collides(currentPiece)) {
                    endGame();
                }
            }
            draw();
        }

        function hardDrop() {
            while (!collides(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            scoreElement.textContent = score;
            drop();
        }

        function move(dir) {
            if (!collides(currentPiece, dir, 0)) {
                currentPiece.x += dir;
                draw();
            }
        }

        function rotatePiece() {
            const rotated = rotate(currentPiece);
            let kick = 0;
            
            if (collides(rotated)) {
                if (!collides(rotated, -1, 0)) {
                    kick = -1;
                } else if (!collides(rotated, 1, 0)) {
                    kick = 1;
                } else if (!collides(rotated, -2, 0)) {
                    kick = -2;
                } else if (!collides(rotated, 2, 0)) {
                    kick = 2;
                } else {
                    return;
                }
            }
            
            currentPiece = rotated;
            currentPiece.x += kick;
            draw();
        }

        function draw() {
            drawBoard();
            if (currentPiece) {
                drawPiece(currentPiece);
                
                let ghostY = currentPiece.y;
                while (!collides({...currentPiece, y: ghostY}, 0, 1)) {
                    ghostY++;
                }
                ctx.globalAlpha = 0.3;
                drawPiece({...currentPiece, y: ghostY});
                ctx.globalAlpha = 1;
            }
            drawNextPiece();
        }

        function resetInterval() {
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            if (gameStarted && !gameOver) {
                gameInterval = setInterval(gameLoop, dropSpeed);
            }
        }

        function gameLoop() {
            if (!isPaused && !gameOver) {
                drop();
            }
        }

        function startGame() {
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                isPaused = false;
                currentPiece = randomPiece();
                nextPiece = randomPiece();
                resetInterval();
                draw();
            }
        }

        function togglePause() {
            if (gameStarted && !gameOver) {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? '▶️ 继续' : '⏸️ 暂停';
            }
        }

        function resetGame() {
            gameStarted = false;
            isPaused = false;
            gameOver = false;
            score = 0;
            level = 1;
            lines = 0;
            dropSpeed = 1000;
            
            scoreElement.textContent = score;
            if (scoreElementDesktop) scoreElementDesktop.textContent = score;
            levelElement.textContent = level;
            if (levelElementDesktop) levelElementDesktop.textContent = level;
            linesElement.textContent = lines;
            if (linesElementDesktop) linesElementDesktop.textContent = lines;
            
            initBoard();
            drawBoard();
            drawNextPiece();
            gameOverModal.classList.add('hidden');
            
            if (gameInterval) {
                clearInterval(gameInterval);
            }
        }

        function endGame() {
            gameOver = true;
            gameStarted = false;
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            
            modalTitle.textContent = '游戏结束！';
            modalMessage.textContent = `最终得分: ${score}\n到达等级: ${level}\n消除行数: ${totalLines}`;
            gameOverModal.classList.remove('hidden');
        }

        document.addEventListener('keydown', function(e) {
            if (!gameStarted || gameOver || isPaused) {
                if (e.key === ' ' && !gameStarted && !gameOver) {
                    startGame();
                    e.preventDefault();
                }
                return;
            }
            
            switch (e.key) {
                case 'ArrowLeft':
                    move(-1);
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    move(1);
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    drop();
                    score += 1;
                    scoreElement.textContent = score;
                    e.preventDefault();
                    break;
                case 'ArrowUp':
                case 's':
                case 'S':
                    rotatePiece();
                    e.preventDefault();
                    break;
                case ' ':
                    hardDrop();
                    e.preventDefault();
                    break;
                case 'Escape':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetGame);

        rotateBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameStarted && !isPaused) rotatePiece(); });
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameStarted && !isPaused) move(-1); });
        downBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameStarted && !isPaused) { drop(); score += 1; scoreElement.textContent = score; } });
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameStarted && !isPaused) move(1); });
        dropBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameStarted && !isPaused) hardDrop(); });

        rotateBtn.addEventListener('mousedown', () => { if (gameStarted && !isPaused) rotatePiece(); });
        leftBtn.addEventListener('mousedown', () => { if (gameStarted && !isPaused) move(-1); });
        downBtn.addEventListener('mousedown', () => { if (gameStarted && !isPaused) { drop(); score += 1; scoreElement.textContent = score; } });
        rightBtn.addEventListener('mousedown', () => { if (gameStarted && !isPaused) move(1); });
        dropBtn.addEventListener('mousedown', () => { if (gameStarted && !isPaused) hardDrop(); });

        initBoard();
        drawBoard();
        nextPiece = randomPiece();
        drawNextPiece();
    </script>
</body>
</html>
